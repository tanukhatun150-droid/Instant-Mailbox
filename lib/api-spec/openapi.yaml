openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: mail
    description: Disposable Mail.tm inbox operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /mail/domains:
    get:
      operationId: listMailDomains
      tags: [mail]
      summary: List active temporary email domains
      responses:
        "200":
          description: Available email domains
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailDomainList"
        "502":
          description: Mail.tm could not be reached
  /mail/mailbox:
    post:
      operationId: createMailMailbox
      tags: [mail]
      summary: Create a temporary mailbox and sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MailboxInput"
      responses:
        "201":
          description: Mailbox created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailboxSession"
        "400":
          description: Invalid domain or username
        "409":
          description: Username is already in use
        "502":
          description: Mail.tm could not create the mailbox
  /mail/messages:
    get:
      operationId: listMailMessages
      tags: [mail]
      summary: List messages in the active mailbox
      description: For 1secmail, supply X-Mail-Provider, X-Mail-Login, and X-Mail-Domain headers.
      security:
        - bearerAuth: []
        - {}
      responses:
        "200":
          description: Inbox messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailMessageList"
        "401":
          description: Mailbox session is invalid
  /mail/messages/{messageId}:
    parameters:
      - name: messageId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getMailMessage
      tags: [mail]
      summary: Get a full email message
      description: For 1secmail, supply X-Mail-Provider, X-Mail-Login, and X-Mail-Domain headers.
      security:
        - bearerAuth: []
        - {}
      responses:
        "200":
          description: Email message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailMessageDetail"
        "401":
          description: Mailbox session is invalid
        "404":
          description: Message not found
    delete:
      operationId: deleteMailMessage
      tags: [mail]
      summary: Delete an email message
      description: For 1secmail, supply X-Mail-Provider, X-Mail-Login, and X-Mail-Domain headers.
      security:
        - bearerAuth: []
        - {}
      responses:
        "204":
          description: Message deleted
        "401":
          description: Mailbox session is invalid
        "404":
          description: Message not found
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    MailDomain:
      type: object
      properties:
        domain:
          type: string
        id:
          type: string
        provider:
          type: string
          enum: [1secmail, mailtm]
      required: [domain, id, provider]
    MailDomainList:
      type: object
      properties:
        domains:
          type: array
          items:
            $ref: "#/components/schemas/MailDomain"
      required: [domains]
    MailboxInput:
      type: object
      properties:
        domain:
          type: string
          minLength: 1
        username:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[A-Za-z0-9._-]+$"
        provider:
          type: string
          enum: [1secmail, mailtm]
      required: [domain, provider]
    MailboxSession:
      type: object
      properties:
        address:
          type: string
        token:
          type: ["string", "null"]
        id:
          type: ["string", "null"]
        password:
          type: ["string", "null"]
        provider:
          type: string
          enum: [1secmail, mailtm]
        login:
          type: ["string", "null"]
        domain:
          type: string
      required: [address, provider, domain]
    MailSender:
      type: object
      properties:
        address:
          type: string
        name:
          type: ["string", "null"]
      required: [address, name]
    MailMessageSummary:
      type: object
      properties:
        id:
          type: string
        sender:
          $ref: "#/components/schemas/MailSender"
        subject:
          type: string
        preview:
          type: string
        date:
          type: string
          format: date-time
        bodyHtml:
          type: string
        bodyText:
          type: ["string", "null"]
        seen:
          type: boolean
        hasAttachments:
          type: boolean
        recipients:
          type: array
          items:
            $ref: "#/components/schemas/MailRecipient"
      required: [id, sender, subject, preview, date, bodyHtml, bodyText, seen, hasAttachments, recipients]
    MailMessageList:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/MailMessageSummary"
        totalItems:
          type: integer
      required: [messages, totalItems]
    MailRecipient:
      type: object
      properties:
        address:
          type: string
        name:
          type: ["string", "null"]
      required: [address, name]
    MailMessageDetail:
      type: object
      properties:
        id:
          type: string
        sender:
          $ref: "#/components/schemas/MailSender"
        recipients:
          type: array
          items:
            $ref: "#/components/schemas/MailRecipient"
        subject:
          type: string
        preview:
          type: string
        date:
          type: string
          format: date-time
        bodyText:
          type: ["string", "null"]
        bodyHtml:
          type: string
        seen:
          type: boolean
        hasAttachments:
          type: boolean
      required: [id, sender, recipients, subject, preview, date, bodyText, bodyHtml, seen, hasAttachments]

